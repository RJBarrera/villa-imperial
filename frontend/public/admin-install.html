<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Villa Imperial Admin</title>

    <meta name="description" content="Panel administrativo de Villa Imperial" />
    <meta name="theme-color" content="#173B57" />
    <meta name="apple-mobile-web-app-title" content="Villa Imperial Admin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon-admin.png?v=2"
    />

    <link rel="manifest" href="/admin.webmanifest?v=2" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6f8;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #173b57;
      }

      .card {
        width: 100%;
        max-width: 420px;
        padding: 32px;
        border-radius: 20px;
        background: #fff;
        text-align: center;
        box-shadow: 0 20px 60px rgba(16, 24, 40, 0.1);
      }

      .logo {
        width: 120px;
        height: 120px;
        border-radius: 24px;
        object-fit: cover;
      }

      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: #667085;
        font-size: 14px;
        line-height: 1.6;
      }

      .hint {
        margin-top: 24px;
        padding: 16px;
        border-radius: 12px;
        background: #edf3f7;
        font-size: 13px;
        color: #173b57;
      }

      a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        border-radius: 10px;
        background: #173b57;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <img
        src="/apple-touch-icon-admin.png?v=2"
        alt="Villa Imperial Admin"
        class="logo"
      />

      <h1>Villa Imperial Admin</h1>

      <p>Panel administrativo de Villa Imperial.</p>

      <div class="hint">
        En Safari toca Compartir → Agregar a Inicio y deja activada la opción
        “Abrir como app web”.
      </div>

      <a href="/admin"> Abrir panel administrativo </a>
    </main>
  </body>
</html>
